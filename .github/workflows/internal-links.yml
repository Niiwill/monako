name: Internal links

on:
  push:
    paths: ["**.html", "sitemap.xml", ".github/scripts/check_internal_links.py"]
  pull_request:
    paths: ["**.html", "sitemap.xml", ".github/scripts/check_internal_links.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check_internal_links.py
